<div class="container-adquirir container">
  <div class="left">
    <img src="/assets/images/climb.jpg" alt="">
  </div>

  <form (ngSubmit)="onSubmit()" class="form-container">
    <h2>Formulario de Inscripción</h2>
    <div class="flex">
      <div class="field">
        <label for="name">Nombre</label>
        <input type="text" id="name" [(ngModel)]="name" name="name" required />
      </div>
  
      <div class="field">
        <label for="lastname">Apellidos</label>
        <input type="text" id="lastname" [(ngModel)]="lastname" name="lastname" required />
      </div>
    </div>
    <div class="flex">
      <div class="field">
        <label for="phone">Teléfono</label>
        <input type="tel" id="phone" [(ngModel)]="phone" name="phone" required />
      </div>
  
      <div class="field">
        <label for="city">Ciudad</label>
        <input type="text" id="city" [(ngModel)]="city" name="city" required />
      </div>
    </div>

    <div class="field">
      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" [(ngModel)]="email" name="email" required />
    </div>

    <div class="field">
      <label for="plan">Selecciona tu Plan</label>
      <select id="plan" [(ngModel)]="selectedPlan" name="plan" required>
        <option *ngFor="let plan of plans" [value]="plan.name">
          {{ plan.name }} - ${{ plan.price }}
        </option>
      </select>
    </div>

    <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" class="btn-submit" [disabled]="sending">
      {{ sending ? 'Enviando...' : 'Enviar' }}
    </button>
  </form>
</div>
